# ============================================================
# Android 现代项目架构 AI 规则
# 架构风格：基于 Now in Android 离线优先、模块化最佳实践
# ============================================================

role: "Android 架构守护者，严格遵循 Now in Android 工程范式"

rules:
  # ==================== 总体架构 ====================
  architecture:
    - "采用 app / feature:* / core:* 三级模块化布局"
    - "feature 模块必须拆分为 :feature:xxx:api 和 :feature:xxx:impl 两个模块，外部仅依赖 api 模块"
    - "api 模块只暴露导航公钥（NavKey）、接口和共享数据类，不包含 UI 或业务实现"
    - "依赖方向严格单向：app → feature:impl → core:domain → core:data，feature:api 可被多方依赖"
    - "applicationId 和 namespace 是独立属性，初始默认一致但必须分别配置，禁止在逻辑中假设二者相同"

  # ==================== 模块清单 ====================
  modularization:
    modules:
      app:
        - "Application 入口，startKoin 加载所有模块，持有 Activity 和顶层 NavHost，无业务代码"
      feature:_:api:
        - "对外暴露导航公钥（@Serializable NavKey）、共享数据类、接口，无实现"
      feature:_:impl:
        - "Screen Composable + ViewModel，暴露 Koin 模块声明 ViewModel"
      core:model:
        - "共享领域模型 data class，无逻辑"
      core:domain:
        - "UseCase 和 Repository 接口定义，纯 Kotlin，Koin 的 factory 声明"
      core:data:
        - "实现 Repository，组合 Remote/Local，离线优先 + Mapper，Koin 的 single 绑定"
      core:network:
        - "Retrofit、OkHttp、序列化配置，提供 Remote DataSource"
      core:datastore:
        - "封装 DataStore<Preferences>，提供 Local DataSource，只暴露挂起函数和 Flow"
      core:database:
        - "Room 数据库配置、Entity 声明、DAO 接口定义，Koin 的 single 绑定"
      core:navigation:
        - "全局导航基础设施：Navigator 封装、NavEntry 接口、自适应布局辅助函数"
      core:ui:
        - "（可选）主题、设计系统组件、通用 Composable"
      core:testing:
        - "（可选）通用 Fake 实现、Turbine 扩展、测试规则"

  # ==================== build-logic 与 Gradle 约定插件 ====================
  build_logic:
    - "项目根目录必须包含 build-logic 目录，作为约定插件的集中管理中心"
    - "build-logic 通过 includeBuild 机制作为独立构建被引入，拥有独立的 settings.gradle.kts 和 build.gradle.kts"
    - "build-logic 内部必须包含 convention 子模块，所有约定插件均定义在该模块中"
    - "每个约定插件必须遵循单一职责原则，一个插件只完成一个特定配置任务"
    - "插件必须可组合，模块可按需应用多个插件"
    - "插件间可共享 Kotlin 扩展函数，避免重复代码"
    - "必须提供以下核心约定插件，AI 生成模块时必须根据模块类型选择正确的插件（插件 ID 前缀为 myproject，实际项目可替换为自定义名称）："
    - "  - myproject.android.application：配置 Application 模块"
    - "  - myproject.android.library：配置纯 Kotlin/Java 库模块"
    - "  - myproject.android.feature：配置 Feature 模块（自动包含 Compose）"
    - "  - myproject.android.application.compose：在 application 基础上增加 Compose 支持"
    - "  - myproject.android.library.compose：在 library 基础上增加 Compose 支持"
    - "  - myproject.android.test：配置 Android 测试模块"
    - "  - myproject.spotless：配置 Spotless 代码格式化规则"
    - "  - myproject.kotlin.jvm：配置纯 Kotlin/JVM 库模块，禁止引入任何 Android 依赖"
    - "  - myproject.android.room：配置 Room 数据库，统一设置 KSP 编译器、Room 依赖及 schema 导出路径"
    - "在模块的 build.gradle.kts 中应用插件示例：plugins { id('myproject.android.feature') }，严禁重复样板配置"
    - "所有第三方依赖版本统一通过 Gradle Version Catalog（libs.versions.toml）管理，约定插件中引用依赖使用 libs.xxx 语法"
    - "项目必须保证 gradle/libs.versions.toml 中的 kotlin 版本号与 ksp 插件版本号保持兼容性对齐，升级时必须成对更新"
    - "约定的 Library 插件必须配置 consumerProguardFiles，确保各模块携带自身混淆规则，防止 Koin 注入类与 @Serializable 类在 R8 混淆时被剥离"

  # ==================== 依赖注入 (Koin) ====================
  dependency_injection:
    - "强制使用 Koin，全面禁止 Hilt、Dagger 及 @Inject、@HiltViewModel 等注解"
    - "Application 类调用 startKoin { modules(allModules) } 加载所有模块"
    - "ViewModel 声明：viewModel { MyViewModel(get()) }，Screen 中通过 koinViewModel() 获取"
    - "Repository/UseCase/DataSource 通过 single 或 factory 暴露，接口绑定：single<MyRepo> { MyRepoImpl(get()) }"
    - "CoroutineDispatcher 必须通过 Koin 注入（如 named(\"io\")），禁止硬编码"

  # ==================== UI 层 ====================
  ui_layer:
    - "UI 完全使用 Jetpack Compose，禁止 XML 布局、ViewBinding"
    - "路由定义为 @Serializable data class/object，禁止字符串路由"
    - "列表-详情页使用 ListDetailSceneStrategy 实现自适应布局"
    - "每个 Screen 对应一个 ViewModel，ViewModel 只暴露一个 StateFlow<UiState>"
    - "在 Composable 中收集 ViewModel 的 StateFlow 必须使用 collectAsStateWithLifecycle()，严禁直接使用 collectAsState()"
    - "单次事件（如 Toast、Snackbar 提示或外部跳转）必须设计为可消费状态或通过专门的事件 Channel/Flow 传递，严禁在 StateFlow 中永久保留"
    - "用户操作处理方式二选一：直接方法调用（如 viewModel.onBookmarkClick()）或 UiEvent 封装，选择后需统一"
    - "UiState 为 data class，包含加载/成功/错误状态"
    - "可复用 Composable 必须无状态，禁止持有 ViewModel"
    - "禁止在 Composable 中直接启动协程或访问数据源"

  # ==================== 导航 ====================
  navigation:
    - "所有导航操作通过 core:navigation 的 Navigator 封装进行"
    - "跨模块导航仅通过 :feature:xxx:api 暴露的 NavKey"
    - "禁止在 ViewModel 中直接导入 NavController"

  # ==================== 领域层 ====================
  domain_layer:
    - "纯 Kotlin 模块，无 Android 依赖"
    - "UseCase 通过 operator fun invoke() 暴露唯一入口，返回 Flow 或 suspend 结果"
    - "Repository 接口定义在此层，只暴露领域模型"

  # ==================== 数据层 ====================
  data_layer:
    - "实现 Repository，组合 Remote + Local，离线优先"
    - "本地键值对存储只允许 DataStore (Preferences)，封装为 DataSource"
    - "DTO/Entity 必须通过 Mapper 转为领域模型"
    - "时间统一使用 kotlinx.datetime.Instant，Room 用 TypeConverter 转换"
    - "错误使用 sealed class Result 或 Kotlin Result，禁止返回 null"

  # ==================== 测试 ====================
  testing:
    - "禁止使用 Mockito/MockK，必须使用手写 Fake 实现"
    - "ViewModel 测试用 Turbine + Fake"
    - "UI 测试用 Compose Testing + 语义操作"

  # ==================== 脚手架 ====================
  scaffolding:
    - "生成脚手架项目时，所有 applicationId、namespace、代码包名统一使用占位符 xxx.yyy.zzz"
    - "目录结构按占位包名创建"
    - "项目根目录生成 init_project.sh 脚本，用于一键替换占位符为真实值"
    - "脚本要求：彩色输出、错误处理、支持 applicationId 与 namespace 分别输入"
    - "脚本执行后项目应可直接编译运行"

  # ==================== 工程化 ====================
  build_quality:
    - "项目必须配置 Spotless，运行 ./gradlew spotlessApply 格式化代码"
    - "CI 必须包含 ./gradlew spotlessCheck"
    - "Gradle 约定插件封装 Spotless 配置"

  # ==================== 禁止项 ====================
  forbidden:
    - "禁止 Hilt、Dagger"
    - "禁止 LiveData"
    - "禁止 @Inject 注解"
    - "禁止 SharedPreferences"
    - "禁止 Proto DataStore"
    - "禁止硬编码 Dispatchers"
    - "禁止 GlobalScope"
    - "禁止模块间直接传递 DTO/Entity"
    - "禁止在 UI 层导入 retrofit/room"
    - "禁止 kotlin-android-extensions"
    - "禁止假设 applicationId 与 namespace 相同"
