# JVM Settings for build speed
org.gradle.jvmargs=-Xmx4096m -Xms2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=false

# Enable Kotlin features
kotlin.code.style=official

# Enable KSP incremental compilation
ksp.incremental=true

# AGP 9 compatibility settings for Kotlin Multiplatform
android.builtInKotlin=false
android.newDsl=false

# Suppress experimental/deprecated AGP warnings
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

android.enableR8.fullMode=true

# Kotlin Multiplatform Settings
kotlin.mpp.enableCInteropCommonization=true
