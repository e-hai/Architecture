# JVM & Kotlin Daemon Settings for build speed
org.gradle.jvmargs=-Xmx4096m -Xms2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
kotlin.daemon.jvmargs=-Xmx4096m

# Gradle Parallel & Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true

# Kotlin Incremental & Multiplatform Settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.mpp.enableCInteropCommonization=true
ksp.incremental=true
