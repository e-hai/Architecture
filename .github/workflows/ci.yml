name: KMP Architecture CI

on:
  push:
    branches:
      - kmp
      - main
  pull_request:
    branches:
      - kmp
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-static-checks:
    name: Fast Static Checks (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts and Gradle Wrapper executable
        run: chmod +x gradlew ./kmp scripts/internal/*.sh scripts/hooks/*.sh

      - name: Run ShellCheck on Automation Scripts
        run: |
          if ! command -v shellcheck &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck ./kmp scripts/internal/*.sh scripts/hooks/*.sh .githooks/pre-commit

      - name: Run Python Script Unit Tests & Config Studio JS Syntax Check
        run: |
          python3 -B -m unittest -v scripts/tests/test_config_studio.py scripts/tests/test_copy_ios_firebase_plist.py scripts/tests/test_scaffold_scripts.py
          if command -v node &> /dev/null && [ -f tools/config-studio/index.html ]; then
            python3 -c 'import pathlib, re, subprocess, tempfile; html = pathlib.Path("tools/config-studio/index.html").read_text(encoding="utf-8"); m = re.search(r"<script type=\"module\">(.*)</script>", html, flags=re.S); assert m; tf = tempfile.NamedTemporaryFile(suffix=".mjs", mode="w", encoding="utf-8"); tf.write(m.group(1)); tf.flush(); subprocess.run(["node", "--check", tf.name], check=True); tf.close()'
          fi

      - name: Run Architecture Redline Verification
        run: ./gradlew verifyArchitecture

      - name: Run Spotless Code Style Check
        run: ./gradlew spotlessCheck

      - name: Run Detekt & Compose Rules Static Analysis
        run: ./gradlew detekt

  android-build-and-test:
    name: Android Unit Tests, Lint & Prod R8 (Ubuntu)
    needs: fast-static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts and Gradle Wrapper executable
        run: chmod +x gradlew ./kmp scripts/internal/*.sh scripts/hooks/*.sh

      - name: Run KMP & Android Host Unit Tests (Fake over Mock)
        run: |
          ./gradlew testAndroidHostTest
          ./gradlew :shared:testAndroidHostTest -PenableDebugPanel=false

      - name: Build Android Host Debug APK & Run Dev Lint
        run: ./gradlew :androidApp:lintDevDebug :androidApp:assembleDevDebug

      - name: Build Android Prod Release APK (Temporary CI Keystore, R8 + Debug Stripped)
        run: |
          CI_KEYSTORE="${RUNNER_TEMP:-/tmp}/ci-release.jks"
          ./kmp keystore \
            --type release \
            --output "$CI_KEYSTORE" \
            --alias ci_release_key \
            --store-pass ci_keystore_pass_123 \
            --key-pass ci_keystore_pass_123 \
            --force
          trap 'rm -f "$CI_KEYSTORE"' EXIT
          PROD_STORE_FILE="$CI_KEYSTORE" \
          PROD_STORE_PASSWORD=ci_keystore_pass_123 \
          PROD_KEY_ALIAS=ci_release_key \
          PROD_KEY_PASSWORD=ci_keystore_pass_123 \
          ./gradlew :androidApp:lintProdRelease :androidApp:assembleProdRelease -PenableDebugPanel=false

  ios-build-and-test:
    name: iOS Unit Tests, SwiftLint & Prod Build (macOS)
    needs: fast-static-checks
    runs-on: macos-14
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts and Gradle Wrapper executable
        run: chmod +x gradlew ./kmp scripts/internal/*.sh scripts/hooks/*.sh

      - name: Run KMP iOS Simulator Unit Tests
        run: ./gradlew iosSimulatorArm64Test

      - name: Run SwiftLint, Generate Xcode Project, Run iOS Simulator Tests & Build Prod
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
          cd iosApp
          swiftlint lint --config .swiftlint.yml --strict
          xcodegen generate --spec project.yml
          SIM_UDID=$(xcrun simctl list devices available iPhone | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -n 1)
          if [ -z "$SIM_UDID" ]; then
            echo "No available iPhone Simulator found!"
            exit 1
          fi
          xcodebuild -project iosApp.xcodeproj -scheme iosApp-Dev -destination "id=${SIM_UDID}" CODE_SIGNING_ALLOWED=NO test
          xcodebuild -project iosApp.xcodeproj -scheme iosApp-Prod -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
