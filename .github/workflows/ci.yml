name: KMP Architecture CI

on:
  push:
    branches:
      - kmp
      - main
  pull_request:
    branches:
      - kmp
      - main

jobs:
  kmp-build-and-test:
    name: Code Quality, Unit Tests & Multiplatform Build
    runs-on: macos-14
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts and Gradle Wrapper executable
        run: chmod +x gradlew scripts/*.sh

      - name: Run Spotless Code Style Check
        run: ./gradlew spotlessCheck

      - name: Run KMP Unit Tests (Fake over Mock)
        run: ./gradlew allTests

      - name: Verify Shared KMP Tests with Debug Panel Disabled
        run: ./gradlew :shared:testAndroidHostTest -PenableDebugPanel=false

      - name: Build Android Host Debug APK
        run: ./gradlew :androidApp:assembleDevDebug

      - name: Run Android Lint Check
        run: ./gradlew :androidApp:lintDevDebug

      - name: Build Android Prod Release APK (Temporary CI Keystore, R8 + Debug Stripped)
        run: |
          CI_KEYSTORE="${RUNNER_TEMP:-/tmp}/ci-release.jks"
          ./scripts/gen_keystore.sh \
            --type release \
            --output "$CI_KEYSTORE" \
            --alias ci_release_key \
            --store-pass ci_keystore_pass_123 \
            --key-pass ci_keystore_pass_123 \
            --force
          trap 'rm -f "$CI_KEYSTORE"' EXIT
          PROD_STORE_FILE="$CI_KEYSTORE" \
          PROD_STORE_PASSWORD=ci_keystore_pass_123 \
          PROD_KEY_ALIAS=ci_release_key \
          PROD_KEY_PASSWORD=ci_keystore_pass_123 \
          ./gradlew :androidApp:assembleProdRelease -PenableDebugPanel=false

      - name: Generate Xcode Project, Run iOS Simulator Tests & Build Prod
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate --spec project.yml
          SIM_UDID=$(xcrun simctl list devices available iPhone | sed -n 's/.*(\([0-9A-F-]\{36\}\)).*/\1/p' | head -n 1)
          if [ -z "$SIM_UDID" ]; then
            echo "No available iPhone Simulator found!"
            exit 1
          fi
          xcodebuild -project iosApp.xcodeproj -scheme iosApp-Dev -destination "id=${SIM_UDID}" CODE_SIGNING_ALLOWED=NO test
          xcodebuild -project iosApp.xcodeproj -scheme iosApp-Prod -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
