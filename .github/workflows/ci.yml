name: KMP Architecture CI

on:
  push:
    branches:
      - kmp
      - main
  pull_request:
    branches:
      - kmp
      - main

jobs:
  kmp-build-and-test:
    name: Code Quality, Unit Tests & Multiplatform Build
    runs-on: macos-14
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make scripts and Gradle Wrapper executable
        run: chmod +x gradlew scripts/*.sh

      - name: Run Spotless Code Style Check
        run: ./gradlew spotlessCheck

      - name: Run KMP Unit Tests (Fake over Mock)
        run: ./gradlew allTests

      - name: Build Android Host Debug APK
        run: ./gradlew :androidApp:assembleDevDebug

      - name: Link Shared.framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run Swift Package Tests
        run: |
          cd iosApp
          swift test

      - name: Generate Xcode Project and Build iOS Simulator App
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          cd iosApp
          xcodegen generate --spec project.yml
          xcodebuild -project iosApp.xcodeproj -scheme iosApp-Dev -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
