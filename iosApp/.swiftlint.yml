# ==============================================================================
# SwiftLint 规范配置（适配 Swift 6 + XcodeGen + KMP 桥接工程）
# 本地与 CI 统一通过 `swiftlint lint --config iosApp/.swiftlint.yml --strict` 强制执行
# ==============================================================================

included:
  - Sources
  - Tests

excluded:
  - Vendor
  - .build
  - build
  - iosApp.xcodeproj

opt_in_rules:
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - unowned_variable_capture
  - weak_delegate

custom_rules:
  no_raw_print_or_nslog:
    name: "禁止绕过 CoreLog 裸打日志"
    included: "Sources/.*\\.swift"
    regex: "\\b(print|NSLog)\\("
    message: "禁止绕过 CoreLog 使用裸 print/NSLog，请统一调用 CoreLog.shared"
    severity: error

line_length:
  warning: 130
  error: 160
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 450
  error: 650

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

trailing_comma:
  mandatory_comma: false

type_name:
  excluded:
    - iOSApp

reporter: "xcode"
