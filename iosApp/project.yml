name: iosApp
options:
  bundleIdPrefix: xxx.yyy.zzz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  # [KIT:log:START]
  LogKit:
    url: https://github.com/e-hai/LogKit-iOS.git
    from: 1.0.0
  # [KIT:log:END]
  # [KIT:crashreport:START]
  CrashReportKit:
    url: https://github.com/e-hai/CrashReportKit-iOS.git
    from: 1.0.0
  # [KIT:crashreport:END]
  # [KIT:analytics:START]
  AnalyticsKit:
    url: https://github.com/e-hai/AnalyticsKit-iOS.git
    from: 1.0.0
  # [KIT:analytics:END]
  # [KIT:abtesting:START]
  AbTestingKit:
    url: https://github.com/e-hai/AbTestingKit-iOS.git
    from: 1.0.0
  # [KIT:abtesting:END]
  # [KIT:mmp:START]
  MmpKit:
    url: https://github.com/e-hai/MmpKit-iOS.git
    from: 1.0.1
  # [KIT:mmp:END]
  # [KIT:ads:START]
  AdsKit:
    url: https://github.com/e-hai/AdsKit-iOS.git
    from: 1.0.2
  # [KIT:ads:END]
  # [KIT:pay:START]
  PayKit:
    url: https://github.com/e-hai/PayKit-iOS.git
    from: 1.1.1
  # [KIT:pay:END]
  # [KIT:push:START]
  PushKit:
    url: https://github.com/e-hai/PushKit-iOS.git
    from: 1.0.0
  # [KIT:push:END]
  # [KIT:video:START]
  VideoKit:
    url: https://github.com/e-hai/VideoKit-iOS.git
    from: 1.0.0
  # [KIT:video:END]
  # [KIT:pag:START]
  LibPag:
    path: Vendor/LibPag
  # [KIT:pag:END]

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: DebugResources/like.pag
        optional: true
    configFiles:
      Debug: Config/Dev.xcconfig
      Release: Config/Prod.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: "$(INFOPLIST_KEY_CFBundleDisplayName)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GADApplicationIdentifier: "$(ADMOB_APP_ID)"
        BASE_URL: "$(BASE_URL)"
        APPSFLYER_KEY: "$(APPSFLYER_KEY)"
        APPSFLYER_APP_ID: "$(APPSFLYER_APP_ID)"
        ANALYTICS_DEBUG_MODE: "$(ANALYTICS_DEBUG_MODE)"
        REMOTE_CONFIG_MIN_FETCH_INTERVAL_SECONDS: "$(REMOTE_CONFIG_MIN_FETCH_INTERVAL_SECONDS)"
        ADMOB_BANNER_ID: "$(ADMOB_BANNER_ID)"
        ADMOB_INTERSTITIAL_ID: "$(ADMOB_INTERSTITIAL_ID)"
        ADMOB_REWARDED_ID: "$(ADMOB_REWARDED_ID)"
        ADMOB_APP_OPEN_ID: "$(ADMOB_APP_OPEN_ID)"
        PAY_SUBS_IDS: "$(PAY_SUBS_IDS)"
        PAY_CONSUMABLE_IDS: "$(PAY_CONSUMABLE_IDS)"
        PAY_NON_CONSUMABLE_IDS: "$(PAY_NON_CONSUMABLE_IDS)"
        NSUserTrackingUsageDescription: "This identifier will be used to deliver personalized ads and measure campaign attribution."
        # [KIT:ads:START]
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
        # [KIT:ads:END]
        # [KIT:push:START]
        UIBackgroundModes:
          - remote-notification
        # [KIT:push:END]
        UILaunchScreen:
          UIColorName: LaunchBackground
    dependencies:
      # [KIT:log:START]
      - package: LogKit
        product: LogKit
      # [KIT:log:END]
      # [KIT:crashreport:START]
      - package: CrashReportKit
        product: CrashReportKit
      # [KIT:crashreport:END]
      # [KIT:analytics:START]
      - package: AnalyticsKit
        product: Analytics
      - package: AnalyticsKit
        product: AnalyticsFirebase
      # [KIT:analytics:END]
      # [KIT:abtesting:START]
      - package: AbTestingKit
        product: AbTesting
      - package: AbTestingKit
        product: AbTestingFirebase
      # [KIT:abtesting:END]
      # [KIT:mmp:START]
      - package: MmpKit
        product: MmpCore
      - package: MmpKit
        product: MmpAppsFlyer
      # [KIT:mmp:END]
      # [KIT:ads:START]
      - package: AdsKit
        product: AdsKit
      # [KIT:ads:END]
      # [KIT:pay:START]
      - package: PayKit
        product: PayKit
      # [KIT:pay:END]
      # [KIT:push:START]
      - package: PushKit
        product: PushKit
      # [KIT:push:END]
      # [KIT:video:START]
      - package: VideoKit
        product: VideoKit
      # [KIT:video:END]
      # [KIT:pag:START]
      - package: LibPag
        product: libpag
      # [KIT:pag:END]
    preBuildScripts:
      - name: Compile KMP Framework
        script: |
          cd "$SRCROOT/.."
          ENABLE_DEBUG_FLAG="true"
          if [ "$CONFIGURATION" = "Release" ]; then
            ENABLE_DEBUG_FLAG="false"
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode -PenableDebugPanel="$ENABLE_DEBUG_FLAG"
        basedOnDependencyAnalysis: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ONLY_ACTIVE_ARCH: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: xxx.yyy.zzz.dev
          INFOPLIST_KEY_CFBundleDisplayName: "Architecture (Dev)"
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_TESTABILITY: YES
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: xxx.yyy.zzz
          INFOPLIST_KEY_CFBundleDisplayName: "Architecture"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          EXCLUDED_SOURCE_FILE_NAMES: like.pag

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  iosApp-Dev:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  iosApp-Prod:
    build:
      targets:
        iosApp: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - iosApp
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
