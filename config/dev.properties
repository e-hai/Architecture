# ===================================================================
# Android 测试环境唯一配置文件 (Dev Environment)
# 职责：日常本地联调、CI 自动化测试与 QA 验收；可直接提交 Git，团队克隆即跑
# ===================================================================

# -------------------------------------------------------------------
# 1. 应用身份与版本信息 (Application Identity & Versions)
# -------------------------------------------------------------------
APP_ID=xxx.yyy.zzz.dev
APP_NAME=Architecture (Dev)
VERSION_NAME=1.0.0
VERSION_CODE=1

# -------------------------------------------------------------------
# 2. 测试签名证书配置 (Android Test Keystore)
# 若 STORE_FILE 留空或文件未找到，Gradle 将自动回退至 ~/.android/debug.keystore 系统测试签名
# -------------------------------------------------------------------
STORE_FILE=
STORE_PASSWORD=android
KEY_ALIAS=androiddebugkey
KEY_PASSWORD=android

# -------------------------------------------------------------------
# 3. 基础网络与 API 环境 (Network & API Gateway)
# -------------------------------------------------------------------
BASE_URL=https://dev-api.example.com
ENABLE_HTTP_LOG=true

# -------------------------------------------------------------------
# 4. Google AdMob 官方公开测试 ID 全集 (Android 专用，永不封号)
# 文档：https://developers.google.com/admob/android/test-ads
# -------------------------------------------------------------------
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_BANNER_ID=ca-app-pub-3940256099942544/9214589741
ADMOB_INTERSTITIAL_ID=ca-app-pub-3940256099942544/1033173712
ADMOB_REWARDED_ID=ca-app-pub-3940256099942544/5224354917
ADMOB_APP_OPEN_ID=ca-app-pub-3940256099942544/9257395921

# -------------------------------------------------------------------
# 5. 十大商业化与基础设施 Kit 测试凭证 (Kits Test Credentials)
# -------------------------------------------------------------------
# CoreMmp (AppsFlyer 测试 Token)
APPSFLYER_KEY=dummy_appsflyer_dev_key

# CoreAnalytics (埋点调试模式)
ANALYTICS_DEBUG_MODE=true

# CoreAbTesting (A/B 测试远程配置最小拉取间隔，测试环境设为 0 即刻生效)
REMOTE_CONFIG_MIN_FETCH_INTERVAL_SECONDS=0

# CorePay (应用内购与订阅商品 ID 目录，逗号分隔，由客户端通过商店 API 动态拉取详情与价格)
PAY_SUBS_IDS=subs_plus,subs_pro
PAY_CONSUMABLE_IDS=consumable_product_01
PAY_NON_CONSUMABLE_IDS=one_time_product_01
