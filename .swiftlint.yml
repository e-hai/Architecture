disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

included:
  - App
  - Packages

excluded:
  - .build
  - DerivedData
  - Tests

line_length:
  warning: 140
  error: 180

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - to
